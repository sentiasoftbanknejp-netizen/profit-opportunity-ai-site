  <h1>Profit Opportunity AI</h1>

  <p>
    Profit Opportunity AI は、EC市場などの公開市場データを収集・分析し、
    市場動向や需要の変化を調査するために開発中の市場調査ツールです。
  </p>

  <h2>目的</h2>
  <p>
    検索動向、商品情報、価格、レビュー件数などの時系列データを分析し、
    市場における需要と供給の変化を把握することを目的としています。
  </p>

  <h2>現在の開発状況</h2>
  <p>
    現在は市場データ収集基盤の開発・検証段階です。
  </p>
